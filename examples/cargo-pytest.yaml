# Polyglot repo — Rust + Python. No npm anywhere.
#
# Nothing in rloop is JavaScript-specific: a gate is a shell command plus
# regexes over its output. The npm exit-code bug is what made the tool
# necessary, not what the tool is limited to.
#
# ⚠️ Unlike examples/next-vitest.yaml, the markers below have NOT been
# validated against a live run of this stack. They match the documented output
# formats of cargo and pytest, which is a starting point, not proof. Run
# `rloop gate --only <name>`, read the log it writes, and confirm every
# `require` pattern actually appears before you let this gate merge anything.

version: 1

forge:
  provider: github
  slug: your-org/your-repo

committer:
  name: your-bot-name
  email: 12345+your-bot@users.noreply.github.com

gates:
  - name: rust-build
    # cargo is honest about exit codes — unlike npm in a workspace — but the
    # belt-and-braces rule still holds: prove it by output, not by status.
    run: cargo build --workspace --all-targets
    require:
      # Printed on every successful build, dev or release profile.
      - "^\\s*Finished "
    forbid:
      # `error[E0433]` is a compile error; bare `error:` covers link and
      # manifest failures that carry no code.
      - "^error\\[E[0-9]+\\]"
      - "^error: "
      - "^\\s*Compiling .* failed"
    timeout_seconds: 1800

  - name: rust-test
    run: cargo test --workspace
    require:
      # Requires a NON-ZERO passed count. `cargo test` prints
      # "test result: ok. 0 passed" for a crate with no tests at all and exits
      # 0, so a broken test-discovery setup would otherwise green having run
      # nothing. This is the same trap as vitest's --passWithNoTests.
      - "^test result: ok\\. [1-9][0-9]* passed"
    forbid:
      - "^test result: FAILED"
      - "^\\s*panicked at "
      - "^error\\[E[0-9]+\\]"
    timeout_seconds: 2400

  - name: python-test
    # Only runs when Python actually changed. Drop `when_paths` if you would
    # rather always run it — conditional gates are a real footgun when the
    # dependency graph is wider than the directory layout suggests.
    when_paths: ["api/**", "pyproject.toml"]
    cwd: api
    run: pytest -q
    require:
      # pytest's summary line: "===== 42 passed in 3.14s ====="
      - "^=+ .*[1-9][0-9]* passed"
    forbid:
      - "^=+ .*[1-9][0-9]* failed"
      - "^=+ .*[1-9][0-9]* error"
      # pytest crashed inside itself; the summary line may be absent entirely.
      - "^INTERNALERROR"
      # Collection failed: tests that never ran cannot have passed.
      - "^ERROR .*::"
    timeout_seconds: 1200

merge:
  enabled: true
  # Allowlist, never a denylist. A branch you forgot to think about must not
  # inherit permission to be merged into.
  allowed_base_branches: [develop]
  method: squash
  delete_branch: true
  require_threads_resolved: true
  # The model that wrote the PR is not allowed to be its own last check.
  required_reviewers: [copilot-pull-request-reviewer]
  reviewer_timeout_seconds: 600

parallel_gates: false

log_dir: .rloop/logs
