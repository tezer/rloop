# Rust workspace, cargo build + cargo test.
#
# Nothing in rloop is JavaScript-specific: a gate is a shell command plus
# regexes over its output. The npm exit-code bug is what made the tool
# necessary, not what the tool is limited to. A single config can mix
# toolchains freely — add a `pytest` or `go test` gate to this file and it runs
# beside the cargo ones.
#
# ⚠️ Unlike examples/next-vitest.yaml, the markers below have NOT been
# validated against a live run. They match the documented output of cargo,
# which is a starting point, not proof. Run `rloop gate --only <name>`, read
# the log it writes, and confirm every `require` pattern actually appears
# before you let this gate merge anything.

version: 1

forge:
  provider: github
  slug: your-org/your-repo

committer:
  name: your-bot-name
  email: 12345+your-bot@users.noreply.github.com

gates:
  - name: build
    # cargo is honest about exit codes — unlike npm in a workspace — but the
    # belt-and-braces rule still holds: prove it by output, not by status.
    run: cargo build --workspace --all-targets
    require:
      # Printed on every successful build, dev or release profile.
      - "^\\s*Finished "
    forbid:
      # `error[E0433]` is a compile error; bare `error:` covers link and
      # manifest failures that carry no code.
      - "^error\\[E[0-9]+\\]"
      - "^error: "
    timeout_seconds: 1800

  - name: test
    run: cargo test --workspace
    require:
      # Requires a NON-ZERO passed count. `cargo test` prints
      # "test result: ok. 0 passed" for a crate with no tests at all and exits
      # 0, so a broken test-discovery setup would otherwise green having run
      # nothing. Same trap as vitest's --passWithNoTests.
      #
      # Note this only catches discovery that broke COMPLETELY. A workspace
      # whose test target quietly stopped compiling one crate still prints a
      # passing result for the others.
      - "^test result: ok\\. [1-9][0-9]* passed"
    forbid:
      - "^test result: FAILED"
      - "^\\s*panicked at "
      - "^error\\[E[0-9]+\\]"
    timeout_seconds: 2400

  # `cargo clippy -- -D warnings` and `cargo fmt --check` fit here too. Both
  # are silent on success, so they need a minted marker rather than a natural
  # one — see "Picking markers that actually hold" in the README.

merge:
  enabled: true
  # Allowlist, never a denylist. A branch you forgot to think about must not
  # inherit permission to be merged into.
  allowed_base_branches: [develop]
  method: squash
  delete_branch: true
  require_threads_resolved: true

reviewers:
  # The model that wrote the PR is not allowed to be its own last check.
  - name: copilot
    kind: forge
    login: copilot-pull-request-reviewer
    # Copilot never submits APPROVED — it files findings as COMMENTED threads,
    # so require_threads_resolved above is what actually gates them. Use
    # `approved` for a human reviewer. There is no default: see the README.
    required_state: any_verdict

  # A second opinion that never touches the network. Must print one JSON
  # document on stdout — narration belongs on stderr.
  # - name: codex
  #   kind: command
  #   run: codex review --base origin/main --json

parallel_gates: false

log_dir: .rloop/logs
